services:
  app:
    image: ghcr.io/falahatiali/iran:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 30s
    
    # Resource limits (compose-spec v2 format)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    
    # Runtime environment from server-side file (secrets stay on server)
    env_file:
      - ${APP_ENV_FILE:-/home/deploy/envFiles/.env.iran-history}
    
    # Networks: external Traefik network + internal
    networks:
      - traefik-network
      - internal
    
    # Traefik v3 labels for reverse proxy routing
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
      # Specify which Docker network Traefik should use (required when container has multiple networks)
      - "traefik.docker.network=traefik-network"
      
      # HTTPS router (apex only; history.verzav.ir is intentionally no longer served)
      - "traefik.http.routers.iran-history.rule=Host(`${APP_DOMAIN:-iiraan.com}`)"
      - "traefik.http.routers.iran-history.entrypoints=websecure"
      - "traefik.http.routers.iran-history.tls=true"
      - "traefik.http.routers.iran-history.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iran-history.service=iran-history"
      - "traefik.http.routers.iran-history.middlewares=iran-history-hsts"

      # www -> apex: own certificate, 301 preserving path and query
      - "traefik.http.routers.iran-history-www.rule=Host(`www.${APP_DOMAIN:-iiraan.com}`)"
      - "traefik.http.routers.iran-history-www.entrypoints=websecure"
      - "traefik.http.routers.iran-history-www.tls=true"
      - "traefik.http.routers.iran-history-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iran-history-www.service=iran-history"
      - "traefik.http.routers.iran-history-www.middlewares=iran-history-www-redirect,iran-history-hsts"
      - "traefik.http.middlewares.iran-history-www-redirect.redirectregex.regex=^https?://www\\.([^/]+)(.*)$$"
      - "traefik.http.middlewares.iran-history-www-redirect.redirectregex.replacement=https://$${1}$${2}"
      - "traefik.http.middlewares.iran-history-www-redirect.redirectregex.permanent=true"

      # Security headers: HSTS (no preload)
      - "traefik.http.middlewares.iran-history-hsts.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.iran-history-hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.iran-history-hsts.headers.stsPreload=false"

      # Service configuration
      - "traefik.http.services.iran-history.loadbalancer.server.port=3000"
    
    # Persistent volume
    volumes:
      - iran-data:/data:rw
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    # Health check - verify app responds AND doesn't show error boundary
    # Tight intervals for fast healthy state during zero-downtime deployment
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:3000/ | grep -q 'تاریخ ایران' && ! curl -sf http://localhost:3000/ | grep -q 'Something went wrong'"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 5s

volumes:
  iran-data:
    name: iran-history-data

networks:
  # External Traefik network (created by Traefik at /opt/traefik)
  traefik-network:
    external: true
  
  # Internal network for non-public services
  internal:
    name: iran-internal
    driver: bridge
