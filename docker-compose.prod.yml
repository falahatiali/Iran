version: "3.9"

services:
  web:
    image: ghcr.io/falahatiali/iran:${IMAGE_TAG:-latest}
    container_name: iran-history
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    
    # Runtime environment from server-side file (secrets stay on server)
    env_file:
      - ${APP_ENV_FILE:-/home/deploy/envFiles/.env.iran-history}
    
    # Networks: external Traefik network + internal
    networks:
      - traefik-network
      - internal
    
    # Traefik v3 labels for reverse proxy routing
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
      # Specify which Docker network Traefik should use (required when container has multiple networks)
      - "traefik.docker.network=traefik-network"
      
      # HTTPS router
      - "traefik.http.routers.iran-history.rule=Host(`${APP_DOMAIN:-history.verzav.ir}`)"
      - "traefik.http.routers.iran-history.entrypoints=websecure"
      - "traefik.http.routers.iran-history.tls=true"
      - "traefik.http.routers.iran-history.tls.certresolver=letsencrypt"
      
      # Service configuration
      - "traefik.http.services.iran-history.loadbalancer.server.port=3000"
    
    # Persistent volume
    volumes:
      - iran-data:/data:rw
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  iran-data:
    name: iran-history-data

networks:
  # External Traefik network (created by Traefik at /opt/traefik)
  traefik-network:
    external: true
  
  # Internal network for non-public services
  internal:
    name: iran-internal
    driver: bridge
